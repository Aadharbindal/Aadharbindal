<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 334 46" width="334" height="46" role="img" aria-label="aadharbindal.github.io/Portfolio"><style>
text { font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
@keyframes popIn { 0% { opacity:0; transform:translateY(6px) scale(.96); }
                    100% { opacity:1; transform:translateY(0) scale(1); } }
@keyframes riseIn { 0% { opacity:0; transform:translateY(8px); }
                     100% { opacity:1; transform:translateY(0); } }
@keyframes drawRule { 0% { transform:scaleX(0); } 100% { transform:scaleX(1); } }
.pop  { opacity:0; transform-box:fill-box; transform-origin:center;
         animation:popIn .5s cubic-bezier(.22,1,.36,1) forwards; }
.rise { opacity:0; animation:riseIn .6s cubic-bezier(.22,1,.36,1) forwards; }
.rule { transform-box:fill-box; transform-origin:left center; transform:scaleX(0);
         animation:drawRule .8s cubic-bezier(.22,1,.36,1) forwards; }
</style><g class="pop" style="animation-delay:.15s"><rect width="332.0" height="44" rx="12" fill="#0b1222" stroke="#3b82f6" stroke-opacity="0.6"/><g transform="translate(18.0,12.0) scale(0.8333)" fill="#38bdf8" stroke="#38bdf8"><circle cx="12" cy="12" r="9" fill="none" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke-width="1.6"/></g><text x="48" y="27.4" font-size="15" font-weight="600" fill="#e6ecf7">aadharbindal.github.io/Portfolio</text></g></svg>