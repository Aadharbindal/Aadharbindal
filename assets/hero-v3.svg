<g class="cubeA"><polygon points="905,173 919.8,181.5 905,190 890.2,181.5" fill="#38bdf8" opacity="0.18"/><polygon points="890.2,181.5 905,190 905,207.0 890.2,198.5" fill="#3b82f6" opacity="0.13"/><polygon points="905,190 919.8,181.5 919.8,198.5 905,207.0" fill="#1d4ed8" opacity="0.17"/></g>
