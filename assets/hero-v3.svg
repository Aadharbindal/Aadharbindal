<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Aadhar Bindal">
<defs>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#38bdf8"/><stop offset="55%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/>
</linearGradient>
<radialGradient id="glow" cx="0.18" cy="0.05" r="0.9">
<stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/><stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.06"/>
<stop offset="100%" stop-color="#060914" stop-opacity="0"/>
</radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#38bdf8"/><stop offset="60%" stop-color="#3b82f6" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
</linearGradient>
<linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#060914" stop-opacity="0"/><stop offset="100%" stop-color="#060914" stop-opacity="0.7"/>
</linearGradient>
<clipPath id="card"><rect x="0" y="0" width="1000" height="240" rx="18"/></clipPath>
</defs>
<style>
.sans { font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
@keyframes riseIn  { 0% { opacity:0; transform:translateY(8px); } 100% { opacity:1; transform:translateY(0); } }
@keyframes recede  { 0% { opacity:0; } 10% { opacity:.5; } 75%,100% { opacity:0; } }
@keyframes bob     { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-9px) rotate(4deg); } }
@keyframes bobSlow { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(7px) rotate(-5deg); } }
@keyframes drawRule{ 0% { transform:scaleX(0); } 100% { transform:scaleX(1); } }
.recede { opacity:0; animation:recede 4.5s linear infinite; }
.cubeA  { transform-box:fill-box; transform-origin:center; animation:bob 6.5s ease-in-out infinite; }
.cubeB  { transform-box:fill-box; transform-origin:center; animation:bobSlow 8s ease-in-out infinite; animation-delay:-2.5s; }
.cubeC  { transform-box:fill-box; transform-origin:center; animation:bob 7.2s ease-in-out infinite; animation-delay:-4s; }
.rise   { opacity:0; animation:riseIn .7s cubic-bezier(.22,1,.36,1) forwards; }
.rule   { transform-box:fill-box; transform-origin:left center; transform:scaleX(0);
           animation:drawRule .8s cubic-bezier(.22,1,.36,1) forwards; }
.d1 { animation-delay:.05s } .d2 { animation-delay:.2s }
.b1 { animation-delay:.55s } .b2 { animation-delay:.78s } .b3 { animation-delay:1.01s }
</style>
<g clip-path="url(#card)">
<rect width="1000" height="240" fill="#060914"/>
