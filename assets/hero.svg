<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Aadhar Bindal, full-stack developer and systems engineer">
<defs>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="45%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="55%" stop-color="#ffffff" stop-opacity="0"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.18" cy="0.1" r="0.9"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/><stop offset="55%" stop-color="#3b82f6" stop-opacity="0.05"/><stop offset="100%" stop-color="#060914" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="60%" stop-color="#3b82f6" stop-opacity="0.35"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#1b2740" stroke-opacity="0.5" stroke-width="1"/></pattern>
<clipPath id="card"><rect x="0" y="0" width="1000" height="290" rx="16"/></clipPath>
</defs>
<style>

    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }

    @keyframes sheen   { 0%,62% { transform:translateX(-620px); }
                          92%,100% { transform:translateX(620px); } }
    @keyframes pulse   { 0%   { r:4;  opacity:.95; }
                          70%  { r:11; opacity:0; }
                          100% { r:11; opacity:0; } }
    @keyframes blink   { 0%,45% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes riseIn  { 0%   { opacity:0; transform:translateY(7px); }
                          100% { opacity:1; transform:translateY(0); } }
    @keyframes typeIn  { from { width:0; } to { width:360px; } }
    @keyframes drift   { 0%,100% { transform:translateY(0); }
                          50%     { transform:translateY(-6px); } }
    @keyframes dash    { to { stroke-dashoffset:-28; } }

    .sheen  { animation:sheen 6s cubic-bezier(.4,0,.2,1) infinite; }
    .ping   { animation:pulse 2.4s ease-out infinite; }
    .caret  { animation:blink 1.1s steps(1) infinite; }
    .drift  { animation:drift 7s ease-in-out infinite; }
    .flow   { stroke-dasharray:3 11; animation:dash 1.6s linear infinite; }

    .rise   { opacity:0; animation:riseIn .7s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay:.05s } .d2 { animation-delay:.18s }
    .d3 { animation-delay:.31s } .d4 { animation-delay:.44s }
    .t1 { animation-delay:.70s } .t2 { animation-delay:1.15s }
    .t3 { animation-delay:1.60s } .t4 { animation-delay:2.05s }

    .typebar { animation:typeIn .5s steps(26) forwards; }
    
</style>
<g clip-path="url(#card)">
<rect width="1000" height="290" fill="#060914"/>
<rect width="1000" height="290" fill="url(#grid)"/>
<rect width="1000" height="290" fill="url(#glow)"/>
<circle class="drift" cx="905" cy="250" r="120" fill="#38bdf8" opacity="0.05"/>
<circle class="drift" cx="60" cy="40" r="90" fill="#3b82f6" opacity="0.045" style="animation-delay:-3s"/>
<g class="rise d1">
<rect x="42" y="40" width="268" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.035" stroke="#1b2740"/>
<circle class="ping" cx="58" cy="53.5" r="4" fill="#38bdf8"/>
<circle cx="58" cy="53.5" r="3.4" fill="#38bdf8"/>
<text class="mono" x="72" y="58" font-size="10.5" fill="#8fa0c0" letter-spacing="1.5">OPEN TO INTERNSHIPS &amp; FULL-TIME ROLES</text>
</g>
<g class="rise d2">
<text class="sans" x="42" y="126" font-size="52" font-weight="800" letter-spacing="-1.6" fill="url(#name)">AADHAR BINDAL</text>
<g style="mix-blend-mode:screen"><g class="sheen"><text class="sans" x="42" y="126" font-size="52" font-weight="800" letter-spacing="-1.6" fill="url(#sheen)">AADHAR BINDAL</text></g></g>
</g>
<rect class="rise d2" x="42" y="140" width="330" height="3" rx="1.5" fill="url(#rule)"/>
<text class="sans rise d3" x="42" y="177" font-size="17" font-weight="500" fill="#f3f6fc">Full-stack developer &amp; systems engineer</text>
<text class="mono rise d4" x="42" y="203" font-size="12.5" fill="#8fa0c0">B.Tech IT · JECRC, Jaipur · Class of 2027</text>
<g class="rise d4">
<text class="sans" x="42" y="248" font-size="22" font-weight="700" fill="#f3f6fc">3</text>
<text class="mono" x="42" y="264" font-size="9.5" fill="#4f5f80" letter-spacing="1.1">LIVE PRODUCTS</text>
<text class="sans" x="156.60000000000002" y="248" font-size="22" font-weight="700" fill="#f3f6fc">10</text>
<text class="mono" x="156.60000000000002" y="264" font-size="9.5" fill="#4f5f80" letter-spacing="1.1">PUBLIC REPOS</text>
<text class="sans" x="265.0" y="248" font-size="22" font-weight="700" fill="#f3f6fc">9.29</text>
<text class="mono" x="265.0" y="264" font-size="9.5" fill="#4f5f80" letter-spacing="1.1">CGPA</text>
</g>
<path class="flow" d="M506 145 H540" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
<g class="rise d3">
<rect x="556" y="44" width="410" height="202" rx="12" fill="#0b1222" stroke="#1b2740"/>
<path d="M556 78 H966" stroke="#1b2740"/>
<circle cx="576" cy="61" r="4.5" fill="#3a3a42"/>
<circle cx="591" cy="61" r="4.5" fill="#3a3a42"/>
<circle cx="606" cy="61" r="4.5" fill="#3a3a42"/>
<text class="mono" x="948" y="65" font-size="10" fill="#4f5f80" text-anchor="end" letter-spacing="1.2">~/aadhar</text>
<g class="rise t1">
<text class="mono" x="576" y="106" font-size="11.5" fill="#3b82f6">$</text>
<text class="mono" x="592" y="106" font-size="11.5" fill="#f3f6fc">aadhar --now</text>
</g>
<g class="rise t2">
<text class="mono" x="576" y="140" font-size="11.5" fill="#f3f6fc">›</text>
<text class="mono" x="592" y="140" font-size="11.5" fill="#8fa0c0">built a CXL testbed at Hewlett Packard Enterprise</text>
</g>
<g class="rise t3">
<text class="mono" x="576" y="170" font-size="11.5" fill="#f3f6fc">›</text>
<text class="mono" x="592" y="170" font-size="11.5" fill="#8fa0c0">shipped 3 products that are live right now</text>
</g>
<g class="rise t4">
<text class="mono" x="576" y="200" font-size="11.5" fill="#f3f6fc">›</text>
<text class="mono" x="592" y="200" font-size="11.5" fill="#8fa0c0">writing C++, Python and TypeScript</text>
</g>
<rect class="rise t4 caret" x="592" y="219" width="7" height="13" fill="#3b82f6"/>
</g>
</g>
<rect x="0.5" y="0.5" width="999" height="289" rx="16" fill="none" stroke="#1b2740"/>
</svg>