<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Aadhar Bindal, full-stack developer and systems engineer">
<defs>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="55%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="45%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/><stop offset="55%" stop-color="#ffffff" stop-opacity="0"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.2" cy="0.05" r="0.95"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/><stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.06"/><stop offset="100%" stop-color="#060914" stop-opacity="0"/></radialGradient>
<radialGradient id="core" cx="0.35" cy="0.3" r="0.7"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="35%" stop-color="#38bdf8" stop-opacity="0.8"/><stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="60%" stop-color="#3b82f6" stop-opacity="0.35"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient>
<linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#060914" stop-opacity="0"/><stop offset="100%" stop-color="#060914" stop-opacity="0.65"/></linearGradient>
<clipPath id="card"><rect x="0" y="0" width="1000" height="340" rx="18"/></clipPath>
<clipPath id="floorClip"><rect x="0" y="210" width="1000" height="130"/></clipPath>
</defs>
<style>

    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }

    @keyframes sheen    { 0%,60% { transform:translateX(-640px); }
                           92%,100% { transform:translateX(640px); } }
    @keyframes pulse    { 0% { r:4; opacity:.95; } 70%,100% { r:13; opacity:0; } }
    @keyframes blink    { 0%,45% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes riseIn   { 0% { opacity:0; transform:translateY(8px); }
                           100% { opacity:1; transform:translateY(0); } }
    @keyframes recede   { 0% { opacity:0; } 8% { opacity:.55; }
                           70% { opacity:0; } 100% { opacity:0; } }
    @keyframes bob      { 0%,100% { transform:translateY(0) rotate(0deg); }
                           50%     { transform:translateY(-10px) rotate(4deg); } }
    @keyframes bobSlow  { 0%,100% { transform:translateY(0) rotate(0deg); }
                           50%     { transform:translateY(8px) rotate(-5deg); } }
    @keyframes spin     { to { transform:rotate(360deg); } }
    @keyframes spinRev  { to { transform:rotate(-360deg); } }
    @keyframes corePulse{ 0%,100% { transform:scale(1); opacity:.9; }
                           50%     { transform:scale(1.18); opacity:1; } }
    @keyframes tilt     { 0%,100% { transform:perspective(900px) rotateY(-9deg) rotateX(2deg); }
                           50%     { transform:perspective(900px) rotateY(-4deg) rotateX(0.5deg); } }

    .sheen   { animation:sheen 6.5s cubic-bezier(.4,0,.2,1) infinite; }
    .ping    { animation:pulse 2.4s ease-out infinite; }
    .caret   { animation:blink 1.1s steps(1) infinite; }
    .recede  { animation:recede 4.5s linear infinite; }
    .cubeA   { transform-box:fill-box; transform-origin:center; animation:bob 6s ease-in-out infinite; }
    .cubeB   { transform-box:fill-box; transform-origin:center; animation:bobSlow 7.5s ease-in-out infinite; animation-delay:-2s; }
    .cubeC   { transform-box:fill-box; transform-origin:center; animation:bob 8.5s ease-in-out infinite; animation-delay:-4s; }
    .orbit1  { animation:spin 9s linear infinite; }
    .orbit2  { animation:spinRev 14s linear infinite; }
    .core    { transform-box:fill-box; transform-origin:center; animation:corePulse 2.6s ease-in-out infinite; }
    .panel3d { transform-box:fill-box; transform-origin:center; animation:tilt 7s ease-in-out infinite; }

    .rise    { opacity:0; animation:riseIn .7s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay:.05s } .d2 { animation-delay:.18s }
    .d3 { animation-delay:.31s } .d4 { animation-delay:.44s }
    .t1 { animation-delay:.80s } .t2 { animation-delay:1.25s }
    .t3 { animation-delay:1.70s } .t4 { animation-delay:2.15s }
    
</style>
