<g style="mix-blend-mode:screen"><g class="sheen"><text class="sans" x="42" y="86" font-size="50" font-weight="800" letter-spacing="-1.6" fill="url(#sheen)">AADHAR BINDAL</text></g></g>
</g>
<rect class="rise d2" x="42" y="100" width="300" height="3" rx="1.5" fill="url(#rule)"/>
<text class="sans rise b1" x="42" y="140" font-size="18" fill="#c3cee3">Information Technology undergraduate at JECRC, Jaipur. I build full-stack web</text>
<text class="sans rise b2" x="42" y="169" font-size="18" fill="#c3cee3">applications and work on applied machine learning — mostly React and Node.js on the</text>
<text class="sans rise b3" x="42" y="198" font-size="18" fill="#c3cee3">front, Python on the model side.</text>
</g>
<rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#1b2740"/>
</svg>