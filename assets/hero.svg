<line class="recede" x1="0" y1="255.5" x2="1000" y2="255.5" stroke="#3b82f6" stroke-width="1" opacity="0" style="animation-delay:-3.00s"/>
<line class="recede" x1="0" y1="276.5" x2="1000" y2="276.5" stroke="#3b82f6" stroke-width="1" opacity="0" style="animation-delay:-3.50s"/></g>
<rect x="0" y="190" width="1000" height="110" fill="url(#floorFade)"/>
<rect width="1000" height="300" fill="url(#glow)"/>
<g class="cubeA"><polygon points="900,210 917.4,220.0 900,230 882.6,220.0" fill="#38bdf8" opacity="0.18"/><polygon points="882.6,220.0 900,230 900,250.0 882.6,240.0" fill="#3b82f6" opacity="0.13"/><polygon points="900,230 917.4,220.0 917.4,240.0 900,250.0" fill="#1d4ed8" opacity="0.17"/></g>
<g class="cubeB"><polygon points="840,253 850.4,259.0 840,265 829.6,259.0" fill="#38bdf8" opacity="0.18"/><polygon points="829.6,259.0 840,265 840,277.0 829.6,271.0" fill="#3b82f6" opacity="0.13"/><polygon points="840,265 850.4,259.0 850.4,271.0 840,277.0" fill="#1d4ed8" opacity="0.17"/></g>
