<g class="rise d1">
<text class="sans" x="46" y="90" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1d4ed8" opacity="0.1">AADHAR BINDAL</text>
<text class="sans" x="45" y="89" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1d4ed8" opacity="0.16">AADHAR BINDAL</text>
